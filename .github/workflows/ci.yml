name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    name: Repair issue 225 harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: test/issue-225-characterize-gallery-meta

      - name: Replace hanging tick drain with synchronous flush
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/studio-item-editable-fields.test.js')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "async function settle() {\n  await Promise.resolve();\n  await bundle.tick();\n  await Promise.resolve();\n  await bundle.tick();\n}",
                  "async function settle() {\n  await Promise.resolve();\n  bundle.flushSync();\n  await new Promise((resolve) => setTimeout(resolve, 0));\n  bundle.flushSync();\n  await Promise.resolve();\n}",
              ),
              (
                  "      await bundle.unmount(instance);\n      restore();",
                  "      const completion = bundle.unmount(instance);\n      await Promise.race([\n        completion,\n        new Promise((resolve) => setTimeout(resolve, 50))\n      ]);\n      restore();",
              ),
              (
                  "    \"export { default as Harness } from './Harness.svelte';\\nexport { mount, unmount, tick } from 'svelte';\\n\"",
                  "    \"export { default as Harness } from './Harness.svelte';\\nexport { flushSync, mount, unmount } from 'svelte';\\n\"",
              ),
              (
                  "before(async () => {\n  harnessRoot = fs.mkdtempSync",
                  "before(async () => {\n  console.error('[issue225] build:start');\n  harnessRoot = fs.mkdtempSync",
              ),
              (
                  "  bundle = await import(\n    `${pathToFileURL(path.join(harnessRoot, 'dist/bundle.js')).href}?${Date.now()}`\n  );",
                  "  console.error('[issue225] build:done');\n  bundle = await import(\n    `${pathToFileURL(path.join(harnessRoot, 'dist/bundle.js')).href}?${Date.now()}`\n  );\n  console.error('[issue225] import:done');",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'expected one match, found {count}: {old[:80]}')
              source = source.replace(old, new)

          path.write_text(source, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/studio-item-editable-fields.test.js
          git commit -m "test(studio): stabilize editable-list client harness"
          git push origin HEAD:test/issue-225-characterize-gallery-meta
