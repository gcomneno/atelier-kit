name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    name: Clean issue 225 scaffolding
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: test/issue-225-characterize-gallery-meta

      - name: Remove temporary diagnostics and repair driver
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/studio-item-editable-fields.test.js')
          source = path.read_text(encoding='utf-8')
          lines = [
              line
              for line in source.splitlines()
              if "console.error('[issue225]" not in line
          ]
          cleaned = '\n'.join(lines) + '\n'
          if cleaned != source:
              path.write_text(cleaned, encoding='utf-8')

          Path('scripts/issue-225-repair-meta-identity.py').unlink(missing_ok=True)
          PY

          git diff --check

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A test/studio-item-editable-fields.test.js scripts/issue-225-repair-meta-identity.py
            git commit -m "chore: remove issue 225 verification scaffolding"
            git push origin HEAD:test/issue-225-characterize-gallery-meta
          fi
