name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Atelier-Kit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/issue-223-panel-surface-adoption

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair forwarded style and axe typing boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/routes/studio/help/+page.svelte': [
                  (
                      "  .help-section + .help-section,\n  .help-toc + .help-section {\n    margin-top: 1rem;\n  }",
                      "  :global(.help-section + .help-section),\n  :global(.help-toc + .help-section) {\n    margin-top: 1rem;\n  }",
                  ),
                  (
                      "  .help-section h3 {\n    margin: 1.1rem 0 0.45rem;\n    font-size: 0.95rem;\n    font-weight: 700;\n  }\n\n  .help-section h3:first-of-type {\n    margin-top: 0.35rem;\n  }",
                      "  :global(.help-section h3) {\n    margin: 1.1rem 0 0.45rem;\n    font-size: 0.95rem;\n    font-weight: 700;\n  }\n\n  :global(.help-section h3:first-of-type) {\n    margin-top: 0.35rem;\n  }",
                  ),
              ],
              'src/routes/studio/system/+page.svelte': [
                  (
                      "  .shutdown-panel {\n    border-color: #e8c5c5;\n    background: linear-gradient(160deg, #fdf3f3 0%, #fff 58%);\n  }\n\n  .shutdown-panel :global(button.danger) {\n    background: #b42318;\n  }\n\n  .shutdown-panel :global(button.danger:hover) {\n    background: #912018;\n  }\n\n  .shutdown-panel :global(button.danger:disabled) {\n    opacity: 0.65;\n    cursor: wait;\n  }",
                      "  :global(.shutdown-panel) {\n    --giu-panel-border-color: #e8c5c5;\n    --giu-panel-background: linear-gradient(160deg, #fdf3f3 0%, #fff 58%);\n  }\n\n  :global(.shutdown-panel button.danger) {\n    background: #b42318;\n  }\n\n  :global(.shutdown-panel button.danger:hover) {\n    background: #912018;\n  }\n\n  :global(.shutdown-panel button.danger:disabled) {\n    opacity: 0.65;\n    cursor: wait;\n  }",
                  ),
              ],
              'test/studio-panel-surface-adoption.test.js': [
                  (
                      "    const axe = (await import('axe-core')).default;\n    const result = await axe.run(window.document, {",
                      "    const axe = (await import('axe-core')).default;\n    const context = /** @type {import('axe-core').ContextSpec} */ (\n      /** @type {unknown} */ (window.document)\n    );\n    const result = await axe.run(context, {",
                  ),
              ],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              source = path.read_text(encoding='utf-8')
              for old, new in changes:
                  count = source.count(old)
                  if count != 1:
                      raise RuntimeError(f'{filename}: expected one match, found {count}')
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/studio/help/+page.svelte \
            src/routes/studio/system/+page.svelte \
            test/studio-panel-surface-adoption.test.js
          git commit -m "fix(studio): align forwarded component style boundaries"
          git push origin HEAD:feat/issue-223-panel-surface-adoption

      - name: Run tests
        run: npm test

      - name: Run SvelteKit checks
        run: npm run check

      - name: Validate YAML content
        run: npm run content:validate

      - name: Build project
        run: npm run build
