name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    name: Repair Meta row identity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: test/issue-225-characterize-gallery-meta

      - name: Apply repair
        run: |
          python3 scripts/issue-225-repair-meta-identity.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/StudioItemMetaFields.svelte test/studio-item-editable-fields.test.js
          git commit -m "fix(studio): preserve Meta row identity during reorder"
          git push origin HEAD:test/issue-225-characterize-gallery-meta
