name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    name: Repair focus element typing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: test/issue-225-characterize-gallery-meta

      - name: Add local DOM element casts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/lib/components/StudioItemGalleryFields.svelte': [
                  (
                      "  function focusRow(index) {\n    fieldset?.querySelectorAll('input[name=\"gallery_files\"]')[index]?.focus();\n  }",
                      "  function focusRow(index) {\n    const input = /** @type {HTMLInputElement | undefined} */ (\n      fieldset?.querySelectorAll('input[name=\"gallery_files\"]')[index]\n    );\n    input?.focus();\n  }",
                  ),
              ],
              'src/lib/components/StudioItemMetaFields.svelte': [
                  (
                      "  function focusRow(index) {\n    fieldset?.querySelectorAll('input[name=\"meta_labels\"]')[index]?.focus();\n  }",
                      "  function focusRow(index) {\n    const input = /** @type {HTMLInputElement | undefined} */ (\n      fieldset?.querySelectorAll('input[name=\"meta_labels\"]')[index]\n    );\n    input?.focus();\n  }",
                  ),
                  (
                      "  function focusAddButton() {\n    fieldset?.querySelector('button.add-button')?.focus();\n  }",
                      "  function focusAddButton() {\n    const button = /** @type {HTMLButtonElement | null | undefined} */ (\n      fieldset?.querySelector('button.add-button')\n    );\n    button?.focus();\n  }",
                  ),
              ],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              source = path.read_text(encoding='utf-8')
              for old, new in changes:
                  if source.count(old) != 1:
                      raise RuntimeError(f'{filename}: expected one focus typing match')
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/StudioItemGalleryFields.svelte src/lib/components/StudioItemMetaFields.svelte
          git commit -m "fix(studio): type editable-field focus targets"
          git push origin HEAD:test/issue-225-characterize-gallery-meta
