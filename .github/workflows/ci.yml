name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  diagnose:
    name: Diagnose editable fields harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run one scenario with bounded output
        run: |
          timeout --signal=TERM 25s \
            node --test \
              --test-reporter=spec \
              --test-name-pattern="Gallery renders zero" \
              test/studio-item-editable-fields.test.js
