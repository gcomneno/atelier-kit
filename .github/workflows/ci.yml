name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    name: Repair Meta reorder harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: test/issue-225-characterize-gallery-meta

      - name: Let Meta reorder settle through its internal tick
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/studio-item-editable-fields.test.js')
          source = path.read_text(encoding='utf-8')

          helper_anchor = "async function waitFor(predicate, message) {\n  for (let attempt = 0; attempt < 20; attempt += 1) {\n    await settle();\n    if (predicate()) return;\n  }\n  assert.fail(message);\n}\n"
          helper_replacement = helper_anchor + "\nasync function waitForPassive(predicate, message) {\n  for (let attempt = 0; attempt < 20; attempt += 1) {\n    await Promise.resolve();\n    await new Promise((resolve) => setTimeout(resolve, 0));\n    if (predicate()) return;\n  }\n  assert.fail(message);\n}\n"

          if source.count(helper_anchor) != 1:
              raise RuntimeError('waitFor helper anchor not found exactly once')
          source = source.replace(helper_anchor, helper_replacement)

          replacements = [
              (
                  "    await waitFor(() => dirty.length === 1, 'Meta move down did not notify dirty');",
                  "    await waitForPassive(() => dirty.length === 1, 'Meta move down did not notify dirty');",
              ),
              (
                  "    await waitFor(() => dirty.length === 2, 'Meta move up did not notify dirty');",
                  "    await waitForPassive(() => dirty.length === 2, 'Meta move up did not notify dirty');",
              ),
          ]

          for old, new in replacements:
              if source.count(old) != 1:
                  raise RuntimeError(f'expected one match: {old}')
              source = source.replace(old, new)

          path.write_text(source, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/studio-item-editable-fields.test.js
          git commit -m "test(studio): observe Meta reorder through internal tick"
          git push origin HEAD:test/issue-225-characterize-gallery-meta
