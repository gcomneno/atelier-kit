name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  characterize:
    name: Characterize editable fields
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all Gallery and Meta scenarios
        run: |
          timeout --signal=TERM 45s \
            node --test \
              --test-reporter=spec \
              test/studio-item-editable-fields.test.js
