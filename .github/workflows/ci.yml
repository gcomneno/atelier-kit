name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  characterize:
    name: Verify Meta identity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Meta reorder identity and FormData
        run: timeout --kill-after=3s 15s node --test --test-reporter=spec --test-name-pattern="Meta object keys" test/studio-item-editable-fields.test.js

      - name: Application boundaries and Relation exclusion
        run: timeout --kill-after=3s 15s node --test --test-reporter=spec --test-name-pattern="Gallery, Meta and Relation" test/studio-item-editable-fields.test.js
