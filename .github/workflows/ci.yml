name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  characterize:
    name: Characterize editable fields
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gallery rendering and minimum row
        run: timeout --kill-after=3s 15s node --test --test-reporter=spec --test-name-pattern="Gallery renders zero" test/studio-item-editable-fields.test.js

      - name: Gallery add remove focus and dirty timing
        run: timeout --kill-after=3s 15s node --test --test-reporter=spec --test-name-pattern="Gallery add and remove" test/studio-item-editable-fields.test.js

      - name: Gallery reorder identity and FormData
        run: timeout --kill-after=3s 15s node --test --test-reporter=spec --test-name-pattern="Gallery object keys" test/studio-item-editable-fields.test.js

      - name: Meta rendering datalists and accessible actions
        run: timeout --kill-after=3s 15s node --test --test-reporter=spec --test-name-pattern="Meta renders zero" test/studio-item-editable-fields.test.js

      - name: Meta add remove focus and dirty timing
        run: timeout --kill-after=3s 15s node --test --test-reporter=spec --test-name-pattern="Meta add and remove" test/studio-item-editable-fields.test.js

      - name: Meta reorder identity and FormData
        run: timeout --kill-after=3s 15s node --test --test-reporter=spec --test-name-pattern="Meta index keys" test/studio-item-editable-fields.test.js

      - name: Application boundaries and Relation exclusion
        run: timeout --kill-after=3s 15s node --test --test-reporter=spec --test-name-pattern="Gallery, Meta and Relation" test/studio-item-editable-fields.test.js
