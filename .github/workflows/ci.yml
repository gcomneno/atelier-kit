name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    name: Repair reorder characterization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: test/issue-225-characterize-gallery-meta

      - name: Remove synthetic focused-subtree moves from reorder tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/studio-item-editable-fields.test.js')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "test('Gallery object keys preserve row DOM identity, focus and FormData order during reordering', async () => {",
                  "test('Gallery object keys preserve row DOM identity and FormData order during reordering', async () => {",
              ),
              (
                  "    const focused = inputs(harness.target, 'gallery_alts')[1];\n    focused.focus();\n    button(harness.target, 'Move image 2 up').click();",
                  "    const identityInput = inputs(harness.target, 'gallery_alts')[1];\n    button(harness.target, 'Move image 2 up').click();",
              ),
              (
                  "    assert.equal(harness.window.document.activeElement, focused);\n    assert.equal(focused.closest('li'), rows(harness.target)[0]);",
                  "    assert.equal(inputs(harness.target, 'gallery_alts')[0], identityInput);\n    assert.equal(identityInput.closest('li'), rows(harness.target)[0]);",
              ),
              (
                  "    assert.equal(harness.window.document.activeElement, focused);\n    assert.equal(focused.closest('li'), rows(harness.target)[1]);",
                  "    assert.equal(inputs(harness.target, 'gallery_alts')[1], identityInput);\n    assert.equal(identityInput.closest('li'), rows(harness.target)[1]);",
              ),
              (
                  "    const physicalFirst = inputs(harness.target, 'meta_labels')[0];\n    physicalFirst.focus();\n    button(harness.target, 'Move detail row 1 down').click();",
                  "    const physicalFirst = inputs(harness.target, 'meta_labels')[0];\n    button(harness.target, 'Move detail row 1 down').click();",
              ),
              (
                  "    assert.equal(harness.window.document.activeElement, physicalFirst);\n    assert.equal(physicalFirst, inputs(harness.target, 'meta_labels')[0]);",
                  "    assert.equal(physicalFirst, inputs(harness.target, 'meta_labels')[0]);",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'expected one match, found {count}: {old[:100]}')
              source = source.replace(old, new)

          path.write_text(source, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/studio-item-editable-fields.test.js
          git commit -m "test(studio): characterize reorder identity without synthetic focus"
          git push origin HEAD:test/issue-225-characterize-gallery-meta
