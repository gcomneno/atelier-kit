name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Atelier-Kit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/issue-223-panel-surface-adoption

      - name: Apply classified Panel and Surface migration
        run: |
          python3 scripts/issue-223-migrate-fixed.py
          git diff --check
          git status --short

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "feat(studio): classify Panel and Surface consumers"
            git push origin HEAD:feat/issue-223-panel-surface-adoption
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SvelteKit checks
        run: npm run check

      - name: Validate YAML content
        run: npm run content:validate

      - name: Build project
        run: npm run build
